<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Navy ramp</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-core)}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(15,31,56,.08)}.n{font-size:11px;font-weight:600;color:var(--text-strong);letter-spacing:.01em}.v{font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--navy-50)"></div><div class="n">50</div><div class="v">var(--navy-50)</div></div><div class="s"><div class="chip" style="background:var(--navy-100)"></div><div class="n">100</div><div class="v">var(--navy-100)</div></div><div class="s"><div class="chip" style="background:var(--navy-200)"></div><div class="n">200</div><div class="v">var(--navy-200)</div></div><div class="s"><div class="chip" style="background:var(--navy-300)"></div><div class="n">300</div><div class="v">var(--navy-300)</div></div><div class="s"><div class="chip" style="background:var(--navy-400)"></div><div class="n">400</div><div class="v">var(--navy-400)</div></div><div class="s"><div class="chip" style="background:var(--navy-500)"></div><div class="n">500</div><div class="v">var(--navy-500)</div></div><div class="s"><div class="chip" style="background:var(--navy-600)"></div><div class="n">600</div><div class="v">var(--navy-600)</div></div><div class="s"><div class="chip" style="background:var(--navy-700)"></div><div class="n">700</div><div class="v">var(--navy-700)</div></div><div class="s"><div class="chip" style="background:var(--navy-800)"></div><div class="n">800</div><div class="v">var(--navy-800)</div></div><div class="s"><div class="chip" style="background:var(--navy-900)"></div><div class="n">900</div><div class="v">var(--navy-900)</div></div></div></body></html>
