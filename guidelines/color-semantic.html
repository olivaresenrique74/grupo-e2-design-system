<!-- @dsCard group="Colors" viewport="700x140" name="Status colours" subtitle="Success · Warning · Danger · Info, each with a soft tint" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Status colours</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-core)}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(15,31,56,.08)}.n{font-size:11px;font-weight:600;color:var(--text-strong);letter-spacing:.01em}.v{font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--success-500)"></div><div class="n">success-500</div><div class="v">var(--success-500)</div></div><div class="s"><div class="chip" style="background:var(--success-50)"></div><div class="n">success-50</div><div class="v">var(--success-50)</div></div><div class="s"><div class="chip" style="background:var(--warning-500)"></div><div class="n">warning-500</div><div class="v">var(--warning-500)</div></div><div class="s"><div class="chip" style="background:var(--warning-50)"></div><div class="n">warning-50</div><div class="v">var(--warning-50)</div></div><div class="s"><div class="chip" style="background:var(--danger-500)"></div><div class="n">danger-500</div><div class="v">var(--danger-500)</div></div><div class="s"><div class="chip" style="background:var(--danger-50)"></div><div class="n">danger-50</div><div class="v">var(--danger-50)</div></div><div class="s"><div class="chip" style="background:var(--info-500)"></div><div class="n">info-500</div><div class="v">var(--info-500)</div></div><div class="s"><div class="chip" style="background:var(--info-50)"></div><div class="n">info-50</div><div class="v">var(--info-50)</div></div></div></body></html>
