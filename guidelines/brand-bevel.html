<!-- @dsCard group="Brand" viewport="700x160" name="Bevel motif" subtitle="The 22° shear and flat corner cut, borrowed from the mark" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Bevel motif</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-core)}</style></head><body><div style="display:flex;gap:16px;align-items:center">
<div style="width:150px;height:88px;background:var(--e2-navy);clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)"></div>
<div style="width:150px;height:88px;background:var(--surface-brand-soft);border:1px solid var(--border-brand);clip-path:polygon(22px 0,100% 0,100% 100%,0 100%)"></div>
<div style="width:150px;height:14px;background:linear-gradient(90deg,var(--e2-orange) 0 46px,var(--navy-100) 46px)"></div>
<div style="flex:1;font-size:12px;line-height:1.6;color:var(--text-body)">Se usa con moderación: un corte por composición, en paneles llenos de azul, cintillos de sección o el tick naranja de una tarjeta. Nunca en botones ni campos.</div></div></body></html>
