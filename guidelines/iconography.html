<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-core)}</style></head><body><div id="i" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;color:var(--e2-navy)"></div>
<div style="margin-top:14px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">lucide-static@0.469.0 · sizes 16 / 20 / 24 / 32 · always currentColor</div>
<script>const names=['shield-check','trending-up','clipboard-list','users','workflow','target','file-text','calendar-check','handshake','chart-no-axes-column','settings-2','arrow-right'];
document.getElementById('i').innerHTML=names.map((n,idx)=>{const s=idx%4===0?28:24;return '<span style="display:inline-block;width:'+s+'px;height:'+s+'px;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.469.0/icons/'+n+'.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.469.0/icons/'+n+'.svg) center/contain no-repeat"></span>'}).join('')</script></body></html>
